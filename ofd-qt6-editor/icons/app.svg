<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 底板渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6FA8FF"/>
      <stop offset="100%" stop-color="#2E56B5"/>
    </linearGradient>
    <!-- 顶部液态玻璃高光 -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 文档阴影 -->
    <filter id="docShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- OFD 字光晕 -->
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 左侧高光条 -->
    <linearGradient id="side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="url(#bg)"/>
  <!-- 顶部液态玻璃弧光 -->
  <path d="M10 28 Q64 6 118 28 L118 50 Q64 28 10 50 Z" fill="url(#topGlow)"/>
  <!-- 左侧高光条 -->
  <rect x="8" y="8" width="36" height="112" rx="28" ry="28" fill="url(#side)"/>
  <!-- 底部微渐变 -->
  <rect x="8" y="90" width="112" height="30" rx="28" ry="28" fill="#0A2A60" fill-opacity="0.2"/>

  <!-- ===== 居中的文档 + OFD ===== -->
  <g transform="translate(26, 22)" filter="url(#docShadow)">
    <!-- 文档底 -->
    <rect x="0" y="0" width="76" height="84" rx="6" ry="6" fill="#FFFFFF"/>
    <!-- 折角 -->
    <path d="M68 0 L76 8 L68 8 Z" fill="#DCE6F5"/>
    <!-- 折角线 -->
    <path d="M68 0 L68 8 L76 8" fill="none" stroke="#B8C8E0" stroke-width="0.8"/>

    <!-- OFD 大字（居中 + 光晕） -->
    <text x="38" y="50" text-anchor="middle"
          font-family="Segoe UI, Arial Black, sans-serif"
          font-size="34" font-weight="900"
          fill="#2E56B5"
          filter="url(#textGlow)">OFD</text>

    <!-- 底部三条淡线 -->
    <rect x="12" y="60" width="52" height="2.8" rx="1.4" ry="1.4" fill="#2E56B5" fill-opacity="0.22"/>
    <rect x="12" y="68" width="40" height="2.8" rx="1.4" ry="1.4" fill="#2E56B5" fill-opacity="0.15"/>
    <rect x="12" y="76" width="52" height="2.8" rx="1.4" ry="1.4" fill="#2E56B5" fill-opacity="0.2"/>
  </g>
</svg>
